name: Build Ecran Viu APK
on:
  push:
    branches:
      - ecran-viu-apk-build-20261123
    paths:
      - .github/workflows/build-ecranviu.yml
      - ecranviu-source.tar.xz.b64
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK packages
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -1)"
          test -n "$MANAGER"
          "$MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack Ecran Viu project
        run: base64 --decode ecranviu-source.tar.xz.b64 | tar -xJf -
      - name: Apply Android 13 full-screen UI fix
        run: python3 patch_android13_ui.py
      - name: Restore foreground service and optional overlay
        run: python3 fix_background_v12.py
      - name: Remove unsupported Android SDK field
        run: sed -i '/userActivityTimeout = /d' app/src/main/java/ro/ecranviu/ceasblocat/ClockActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify built APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK v2 signing and actual permissions
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          "$SDK_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.POST_NOTIFICATIONS'
          if "$SDK_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -E 'android.permission.(INTERNET|READ_CONTACTS|READ_SMS|RECORD_AUDIO|CAMERA)' ; then
            echo "Unexpected sensitive permission"; exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcranViu-CeasBlocat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish built APK on isolated branch
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/EcranViu-CeasBlocat.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/EcranViu-CeasBlocat.apk
          git commit -m "Build Ecran Viu APK" || exit 0
          git push
